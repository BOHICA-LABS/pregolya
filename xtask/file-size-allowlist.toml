# File size allowlist for cargo xtask check-file-size
#
# Entries require: path + reason + approver + date
# Each entry must be reviewed in a PR.
#
# Generated code (OUT_DIR/, *.gen.rs) and tests/fixtures/ are auto-excluded by glob.
# Inline opt-out comments are NOT permitted — this file is the only opt-out path.
#
# NOTE: tokei reports raw Code lines (excluding blanks and comments). The xtask
# check_file_size gate adjusts this by subtracting code lines inside
# #[cfg(test)] mod blocks (using proc_macro2 span analysis), so only production
# code lines count toward the thresholds.
#
# Thresholds (tokei Code metric):
#   Production files: soft 500 / hard 750 code-lines
#   Test files:       soft 1000 / hard 1500 code-lines
#
# Allowlist entries MUST use workspace-relative paths (e.g. "crates/pregolya-core/src/error.rs")
# to prevent over-broad matching. A bare filename like "error.rs" would match every crate's
# error.rs — use the full path from workspace root instead.
#
# Example entry:
# [[allow]]
# path = "crates/pregolya-core/src/big_module.rs"
# reason = "Cohesive state machine — splitting would break invariants"
# approver = "architect"
# date = "2026-09-01"

[[allow]]
path = "xtask/src/main.rs"
reason = "CI gate dispatch binary implementing 5 lint checkers (no-panic, client-timeout, anyhow-ban, description-cache-key, file-size) plus shared allowlist parsing and file-walking utilities. All gates share a common proc_macro2-based scan-and-report pattern; the file is cohesive by function. Adjusted code-line count (tokei Code minus #[cfg(test)] spans via proc_macro2 span-locations) exceeds the 750-line hard gate."
approver = "jmagady"
date = "2026-09-19"

[[allow]]
path = "xtask/src/tests.rs"
reason = "Canonical conformance test suite for all xtask CI gate scanners (BC-2.14.003, BC-2.14.004, BC-2.14.005, file-size, anyhow-ban, description-cache-key). Table-driven and parameterised tests covering every scanner rule, violation fixture, and negative guard. The suite is cohesive by gate; splitting into per-gate files would fragment the shared fixture helpers and scan-and-report test pattern without improving reviewability. Pass-4 red-gate additions (F-01 delimiter gap, F-02 non-_ catch-all, F-03 fixture-mode, O-1 zero-timeout forms) pushed the code-line count past the 1500-line test hard gate."
approver = "jmagady"
date = "2026-09-22"

