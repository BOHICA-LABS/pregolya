# File size allowlist for cargo xtask check-file-size
#
# Entries require: path + reason + approver + date
# Each entry must be reviewed in a PR.
#
# Generated code (OUT_DIR/, *.gen.rs) and tests/fixtures/ are auto-excluded by glob.
# Inline opt-out comments are NOT permitted — this file is the only opt-out path.
#
# NOTE: tokei counts ALL code-lines in a file including inline #[cfg(test)] blocks
# in production files. Inline test modules contribute to the production file's code
# count — this is intentional (consistent with xtask/src/main.rs check_file_size NOTE).
#
# Thresholds (tokei Code metric):
#   Production files: soft 500 / hard 750 code-lines
#   Test files:       soft 1000 / hard 1500 code-lines
#
# Allowlist entries MUST use workspace-relative paths (e.g. "crates/pregolya-core/src/error.rs")
# to prevent over-broad matching. A bare filename like "error.rs" would match every crate's
# error.rs — use the full path from workspace root instead.
#
# Example entry:
# [[allow]]
# path = "crates/pregolya-core/src/big_module.rs"
# reason = "Cohesive state machine — splitting would break invariants"
# approver = "architect"
# date = "2026-09-01"

[[allow]]
path = "xtask/src/main.rs"
reason = "Cohesive multi-command CI task runner. FIX-B cfg_test-exclusion helper, FIX-E/F/K safety assertions and validation logic were added in adversarial pass 2 fix-burst. Adjusted code (post-cfg_test exclusion) is 762 lines — 12 over the 750 hard gate. Splitting into sub-modules would fragment the command dispatch table and shared helpers without improving cohesion; the file still does one thing (enforce CI gates for pregolya workspace)."
approver = "jmagady"
date = "2026-09-19"

