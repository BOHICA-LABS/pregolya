# pregolya CI pipeline
#
# Gate enforcement state: every Rust job is guarded by
#   `if: hashFiles('Cargo.toml') != ''`
# When Cargo.toml is absent the "Skip (no workspace yet)" step runs `exit 1`
# — the job FAILS rather than passing vacuously.  A pass on a required status
# check while measuring nothing would certify unmeasured state (Mechanism-3
# defect).  Branch protection therefore REQUIRES the Phase 3 workspace commit
# before any PR can merge against develop.
#
# File-size gate (D12) is additionally guarded on xtask existence:
#   `if: hashFiles('Cargo.toml') != '' && hashFiles('xtask/Cargo.toml') != ''`
# Same non-certifying-fail policy applies when either is absent.
#
# IMPORTANT: factory-artifacts branch commits are excluded from CI by
# `branches-ignore: factory-artifacts` so .factory/ artifacts can be pushed
# without triggering these failing jobs.
#
# Action SHA pins (update when bumping versions):
#   actions/checkout           v4.2.2  → 11bd71901bbe5b1630ceea73d27597364c9af683
#   dtolnay/rust-toolchain     master  → fa04a1451ff1842e2626ccb99004d0195b455a88
#   Swatinem/rust-cache        v2.7.5  → 82a92a6e8fbeee089604da2575dc567ae9ddeaab

name: CI

on:
  push:
    branches-ignore:
      - factory-artifacts
  pull_request:
    branches:
      - main
      - develop

# Least-privilege default; individual jobs can elevate where needed.
permissions:
  contents: read

# Cancel in-flight runs for the same ref on new pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # fmt — cargo fmt --check
  # ─────────────────────────────────────────────────────────────────────────────
  fmt:
    name: CI / fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        # v4.2.2

      - name: Install Rust toolchain
        if: hashFiles('Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        # master
        with:
          toolchain: stable
          components: rustfmt

      - name: cargo fmt --check
        if: hashFiles('Cargo.toml') != ''
        run: |
          set -euo pipefail
          cargo fmt --all -- --check

      - name: Skip (no workspace yet)
        if: hashFiles('Cargo.toml') == ''
        run: |
          set -euo pipefail
          echo "NONCERTIFYING: No Cargo.toml present — this job cannot validate anything."
          echo "A vacuous pass (exit 0) on a required status check certifies nothing and"
          echo "allows branch protection to be satisfied by an empty repository."
          echo "This job fails intentionally until the Phase 3 workspace (Cargo.toml) is committed."
          exit 1

  # ─────────────────────────────────────────────────────────────────────────────
  # clippy — deny warnings
  # ─────────────────────────────────────────────────────────────────────────────
  clippy:
    name: CI / clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        # v4.2.2

      - name: Install Rust toolchain
        if: hashFiles('Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        # master
        with:
          toolchain: stable
          components: clippy

      - name: Cache Cargo registry and build artefacts
        if: hashFiles('Cargo.toml') != ''
        uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab
        # v2.7.5

      - name: cargo clippy (deny warnings)
        if: hashFiles('Cargo.toml') != ''
        run: |
          set -euo pipefail
          cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Skip (no workspace yet)
        if: hashFiles('Cargo.toml') == ''
        run: |
          set -euo pipefail
          echo "NONCERTIFYING: No Cargo.toml present — this job cannot validate anything."
          echo "This job fails intentionally until the Phase 3 workspace (Cargo.toml) is committed."
          exit 1

  # ─────────────────────────────────────────────────────────────────────────────
  # test — cargo test (all crates, all features)
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: CI / test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        # v4.2.2

      - name: Install Rust toolchain
        if: hashFiles('Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        # master
        with:
          toolchain: stable

      - name: Cache Cargo registry and build artefacts
        if: hashFiles('Cargo.toml') != ''
        uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab
        # v2.7.5

      - name: cargo test
        if: hashFiles('Cargo.toml') != ''
        run: |
          set -euo pipefail
          cargo test --workspace --all-features

      - name: Skip (no workspace yet)
        if: hashFiles('Cargo.toml') == ''
        run: |
          set -euo pipefail
          echo "NONCERTIFYING: No Cargo.toml present — this job cannot validate anything."
          echo "This job fails intentionally until the Phase 3 workspace (Cargo.toml) is committed."
          exit 1

  # ─────────────────────────────────────────────────────────────────────────────
  # build — cargo build --release (smoke-check linkage)
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: CI / build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        # v4.2.2

      - name: Install Rust toolchain
        if: hashFiles('Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        # master
        with:
          toolchain: stable

      - name: Cache Cargo registry and build artefacts
        if: hashFiles('Cargo.toml') != ''
        uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab
        # v2.7.5

      - name: cargo build --release
        if: hashFiles('Cargo.toml') != ''
        run: |
          set -euo pipefail
          cargo build --workspace --all-features --release

      - name: Skip (no workspace yet)
        if: hashFiles('Cargo.toml') == ''
        run: |
          set -euo pipefail
          echo "NONCERTIFYING: No Cargo.toml present — this job cannot validate anything."
          echo "This job fails intentionally until the Phase 3 workspace (Cargo.toml) is committed."
          exit 1

  # ─────────────────────────────────────────────────────────────────────────────
  # file-size-gate — D12: cargo xtask check-file-size
  # Guarded on BOTH Cargo.toml (workspace) AND xtask/Cargo.toml (xtask crate).
  # Becomes active automatically in Phase 3 once the xtask crate is present.
  # ─────────────────────────────────────────────────────────────────────────────
  file-size-gate:
    name: CI / file-size-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        # v4.2.2

      - name: Install Rust toolchain
        if: hashFiles('Cargo.toml') != '' && hashFiles('xtask/Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        # master
        with:
          toolchain: stable

      - name: Cache Cargo registry and build artefacts
        if: hashFiles('Cargo.toml') != '' && hashFiles('xtask/Cargo.toml') != ''
        uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab
        # v2.7.5

      - name: Install tokei
        if: hashFiles('Cargo.toml') != '' && hashFiles('xtask/Cargo.toml') != ''
        run: |
          set -euo pipefail
          cargo install tokei --locked

      - name: cargo xtask check-file-size (D12)
        if: hashFiles('Cargo.toml') != '' && hashFiles('xtask/Cargo.toml') != ''
        run: |
          set -euo pipefail
          cargo xtask check-file-size

      - name: Skip (workspace or xtask not yet initialised)
        if: hashFiles('Cargo.toml') == '' || hashFiles('xtask/Cargo.toml') == ''
        run: |
          set -euo pipefail
          echo "NONCERTIFYING: Cargo.toml or xtask/Cargo.toml absent — this job cannot validate anything."
          echo "This job fails intentionally until both the workspace (Cargo.toml) and xtask crate"
          echo "(xtask/Cargo.toml) are committed (Phase 3)."
          exit 1

  # ─────────────────────────────────────────────────────────────────────────────
  # deny — cargo deny check (license + bans + advisories)
  # ─────────────────────────────────────────────────────────────────────────────
  deny:
    name: CI / deny
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        # v4.2.2

      - name: Install Rust toolchain
        if: hashFiles('Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        # master
        with:
          toolchain: stable

      - name: Cache Cargo registry and build artefacts
        if: hashFiles('Cargo.toml') != ''
        uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab
        # v2.7.5

      - name: Install cargo-deny
        if: hashFiles('Cargo.toml') != ''
        run: |
          set -euo pipefail
          cargo install cargo-deny --locked

      - name: Run cargo deny
        if: hashFiles('Cargo.toml') != ''
        run: |
          set -euo pipefail
          cargo deny check

      - name: Skip (no workspace yet)
        if: hashFiles('Cargo.toml') == ''
        run: |
          set -euo pipefail
          echo "NONCERTIFYING: No Cargo.toml present — this job cannot validate anything."
          echo "This job fails intentionally until the Phase 3 workspace (Cargo.toml) is committed."
          exit 1

  # ─────────────────────────────────────────────────────────────────────────────
  # audit — cargo audit (RUSTSEC advisory database)
  # ─────────────────────────────────────────────────────────────────────────────
  audit:
    name: CI / audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        # v4.2.2

      - name: Install Rust toolchain
        if: hashFiles('Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        # master
        with:
          toolchain: stable

      - name: Cache Cargo registry and build artefacts
        if: hashFiles('Cargo.toml') != ''
        uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab
        # v2.7.5

      - name: Install cargo-audit
        if: hashFiles('Cargo.toml') != ''
        run: |
          set -euo pipefail
          cargo install cargo-audit --locked

      - name: Run cargo audit
        if: hashFiles('Cargo.toml') != ''
        run: |
          set -euo pipefail
          cargo audit

      - name: Skip (no workspace yet)
        if: hashFiles('Cargo.toml') == ''
        run: |
          set -euo pipefail
          echo "NONCERTIFYING: No Cargo.toml present — this job cannot validate anything."
          echo "This job fails intentionally until the Phase 3 workspace (Cargo.toml) is committed."
          exit 1
