# sprint-state.yaml — pregolya Phase 2 / Phase 3 per-story state tracker
# Updated by state-manager as stories transition through lifecycle phases.
# Status values: not-started | spec-ready | in-progress | red-gate | green | pr-open | merged | done
# Fields:
#   story_id: canonical story ID (immutable per POL-1)
#   wave: wave number (1, 2, or 6)
#   status: current lifecycle status
#   bcs: behavioral contracts covered by this story
#   vps: verification properties anchored to this story
#   points: story point estimate
#   tdd_mode: strict (default) | facade
#   priority: P0 | P1 | P2
#   crate: primary target crate(s)
#   pr_url: GitHub PR URL (set by pr-manager at PR creation)
#   merged_sha: develop HEAD SHA after merge (set by state-manager)

