pre-commit:
  commands:
    fmt:
      run: cargo fmt --all --check
    clippy:
      run: cargo clippy --workspace --all-targets -- -D warnings
    layout:
      run: cargo xtask check-file-size

pre-push:
  commands:
    check:
      run: just check

pre-tag:
  commands:
    semver-checks:
      run: cargo semver-checks
    audit:
      run: cargo audit
    deny:
      run: cargo deny check
