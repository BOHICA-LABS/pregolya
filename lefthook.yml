pre-commit:
  commands:
    fmt:
      run: cargo fmt --all --check
    clippy:
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings
    layout:
      run: cargo xtask check-file-size

pre-push:
  commands:
    # Guard: tokei must be installed before the file-size gate runs.
    # Fail with a helpful message rather than a cryptic tokei-not-found error.
    check-tokei:
      run: |
        command -v tokei >/dev/null 2>&1 || { echo "ERROR: tokei not found. Run 'just setup' to install required tools."; exit 1; }
    check:
      run: just check
    # Fix 5 (F-P48-PROCESS-GAP-001): burst-parity check — verify the newest
    # fix-burst-N section in CHANGELOG.md has a matching re-verification section
    # in evidence-report.md. Implemented here (not in records-lint.sh) because
    # CHANGELOG.md and evidence-report.md live on the feature branch, not in .factory/.
    check-burst-records-parity:
      run: |
        NEWEST_BURST=$(grep -oE '^## fix-burst-[0-9]+' CHANGELOG.md 2>/dev/null | head -1 | grep -oE '[0-9]+' || true)
        if [ -z "$NEWEST_BURST" ]; then
          echo "[BURST-PARITY] No fix-burst sections found in CHANGELOG.md — skipping check."
          exit 0
        fi
        # Derive story ID from current branch name (feature/S-X.XX → S-X.XX).
        # Avoids hardcoding a story-specific path that breaks on every future branch.
        BRANCH=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "")
        STORY_ID=$(echo "$BRANCH" | grep -oE 'S-[0-9]+\.[0-9]+' | head -1)
        if [ -z "$STORY_ID" ]; then
          # Not a feature branch — check if any evidence report exists under docs/demo-evidence/.
          EVIDENCE_REPORT=$(find docs/demo-evidence -name "evidence-report.md" 2>/dev/null | head -1)
          if [ -z "$EVIDENCE_REPORT" ]; then
            echo "[BURST-PARITY SKIP] Not a feature branch and no evidence-report.md found — skipping check"
            exit 0
          fi
        else
          EVIDENCE_REPORT="docs/demo-evidence/${STORY_ID}/evidence-report.md"
        fi
        if [ ! -f "$EVIDENCE_REPORT" ]; then
          echo "[BURST-PARITY FAIL] evidence-report.md not found at ${EVIDENCE_REPORT} — failing closed"
          exit 1
        fi
        if ! grep -q "^## fix-burst-${NEWEST_BURST} re-verification" "$EVIDENCE_REPORT"; then
          echo "[BURST-PARITY FAIL] CHANGELOG.md has '## fix-burst-${NEWEST_BURST}' but evidence-report.md is missing '## fix-burst-${NEWEST_BURST} re-verification'."
          exit 1
        fi
        echo "[BURST-PARITY PASS] fix-burst-${NEWEST_BURST}: matched in CHANGELOG.md and evidence-report.md."

pre-tag:
  commands:
    semver-checks:
      run: cargo semver-checks
    audit:
      run: cargo audit
    deny:
      run: cargo deny check
