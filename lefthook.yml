pre-commit:
  commands:
    fmt:
      run: cargo fmt --all --check
    clippy:
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings
    layout:
      run: cargo xtask check-file-size

pre-push:
  commands:
    # Guard: tokei must be installed before the file-size gate runs.
    # Fail with a helpful message rather than a cryptic tokei-not-found error.
    check-tokei:
      run: |
        command -v tokei >/dev/null 2>&1 || { echo "ERROR: tokei not found. Run 'just setup' to install required tools."; exit 1; }
    check:
      run: just check
    # Fix 5 (F-P48-PROCESS-GAP-001): burst-parity check — verify the newest
    # fix-burst-N section in CHANGELOG.md has a matching re-verification section
    # in evidence-report.md with consistent finding-ID sets and tally counts.
    # Enforces: ID-set agreement, tally-count agreement,
    # tally-sum↔ID-count reconciliation, pass-number agreement,
    # ER-newest-burst agreement, per-severity histogram agreement,
    # and duplicate-finding-ID detection.
    # Logic extracted to scripts/check-burst-records-parity.sh for testability.
    check-burst-records-parity:
      run: bash scripts/check-burst-records-parity.sh
    # Self-probe: runs the script's --self-probe mode to verify the regex logic.
    # Runs eight synthetic probes covering ID-mismatch, tally-divergent,
    # tally-sum≠id-count, pass-number-divergent, tally-line-absent,
    # er-newest-burst-divergent, per-severity-histogram-divergent,
    # and duplicate-id-detected scenarios.
    # Always passes on a correctly-functioning script; fails if a regex
    # regression is introduced.
    burst-parity-self-probe:
      run: bash scripts/check-burst-records-parity.sh --self-probe

pre-tag:
  commands:
    semver-checks:
      run: cargo semver-checks
    audit:
      run: cargo audit
    deny:
      run: cargo deny check
