[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Zlib",
]

[bans]
multiple-versions = "warn"
deny = [
    # native-tls causes ~65s macOS Keychain init and MITM proxy interception risk.
    # All reqwest deps must use rustls-tls instead.
    { name = "native-tls" },
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "openssl-probe" },
]

[advisories]
# cargo-deny v2 schema: removed deprecated v1 keys (vulnerability, unmaintained="warn",
# yanked, notice). Use the correct v2 unmaintained value and keep ignore list.
unmaintained = "workspace"
ignore = []

[sources]
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
