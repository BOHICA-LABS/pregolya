[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Zlib",
]

[bans]
multiple-versions = "warn"
deny = [
    # native-tls causes ~65s macOS Keychain init and MITM proxy interception risk.
    # All reqwest deps must use rustls-tls instead.
    { name = "native-tls" },
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "openssl-probe" },
]

[advisories]
# cargo-deny v2 schema (validated against 0.20.2).
# yanked="deny"     — reject any dep yanked from crates.io (SEC-003).  Action value.
# unmaintained="all"  — enforce across ALL deps (workspace + transitive). Scope value.
#   "workspace" is weaker: it only checks workspace-direct deps and misses transitive
#   RUSTSEC advisories (e.g. wasmtime class of findings).  "all" restores full coverage.
# unsound="all"     — reject crates with published unsoundness advisories across all deps.
yanked = "deny"
unmaintained = "all"
unsound = "all"
ignore = []

[sources]
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
