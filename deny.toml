[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-DFS-2016",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Zlib",
]

[bans]
multiple-versions = "warn"
deny = [
    # native-tls causes ~65s macOS Keychain init and MITM proxy interception risk.
    # All reqwest deps must use rustls-tls instead.
    { name = "native-tls" },
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "openssl-probe" },
]

[advisories]
version = 2
vulnerability = "deny"
unmaintained = "warn"
yanked = "deny"
notice = "warn"
ignore = []

[sources]
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
